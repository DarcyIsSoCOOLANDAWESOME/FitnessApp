<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homescreen</title>
  </head>
  <body>
    <h1>Fitness App</h1>

    <h2>Sign Up</h2>
    <input type="signupEmail" type="email" placeholder="Email" />
    <input type="signupPassword" type="password" placeholder="Password" />
    <button id="signupBtn">Sign Up</button>

    <h2>Login</h2>
    <input type="loginEmail" type="email" placeholder="Email" />
    <input type="loginPassword" type="password" placeholder="Password" />
    <button id="loginBtn">Login</button>

    <h2>Dashboard</h2>
    <button id="logoutBtn">Logout</button>
  </body>
</html>
